<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM SEO · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#152033;--muted:#687487;--line:#e3e7ee;--side:#0f1a2c;--side2:#1a2842;--acc:#16956a;--acc2:#e6f6ef;--blue:#2d6ae0;--blue2:#e9f0fd;--amber:#b57c0c;--amber2:#fdf4e1;--red:#cf4040;--red2:#fcebeb;--gray2:#eef1f5;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{width:232px;background:var(--side);color:#c9d2e1;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 16px;font-weight:700;color:#fff;font-size:15px;display:flex;gap:10px;align-items:center}
.logo{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:700}
.brand small{display:block;font-weight:500;color:#8693a8;font-size:11.5px}
nav{display:flex;flex-direction:column}
nav a{display:flex;align-items:center;gap:11px;padding:9px 18px;color:#c9d2e1;text-decoration:none;font-weight:500;border-left:3px solid transparent}
nav a:hover{background:var(--side2)}
nav a.on{background:var(--side2);color:#fff;border-left-color:var(--acc)}
nav a svg{width:17px;height:17px;flex-shrink:0}
nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#6c7a92;padding:16px 18px 6px}
.nbadge{margin-left:auto;background:var(--acc);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:600}
.side-foot{margin-top:auto;padding:14px 18px;font-size:12px;color:#8693a8;border-top:1px solid #20304d}
.side-foot button{background:none;border:1px solid #2c3d5e;color:#c9d2e1;border-radius:7px;padding:6px 10px;cursor:pointer;width:100%;margin-top:8px}
main{flex:1;min-width:0;padding:26px 30px 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em}
.top p{margin:3px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--gray2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.blue{background:var(--blue)}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);font-size:18px;padding:2px 6px;border-radius:6px}
.icon-btn:hover{background:var(--gray2);color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 12px;font-size:14.5px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:1.4fr 1fr}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tbl{padding:0;overflow:auto}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--gray2);color:#3d4a5e;margin:1px 3px 1px 0;font-weight:500}
.st{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-block}
.st.borrador{background:var(--gray2);color:#4b586c}.st.enviada{background:var(--blue2);color:var(--blue)}.st.pagada{background:var(--acc2);color:var(--acc)}.st.vencida{background:var(--red2);color:var(--red)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.name{font-weight:600}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
label.lb{display:block;font-size:12.5px;font-weight:600;margin:12px 0 5px;color:#3b475a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search{max-width:280px}
/* pipeline */
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#eaeef3;border-radius:var(--r);padding:10px;min-height:380px;transition:background .15s}
.col.over{background:#dbe7f7}
.colh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 10px;font-weight:600;font-size:13px}
.colh span{color:var(--muted);font-weight:500;font-size:12px}
.deal{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px;cursor:grab;box-shadow:0 1px 2px rgba(15,26,44,.04)}
.deal:active{cursor:grabbing}
.deal .t{font-weight:600;font-size:13.5px}
.deal .c{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
.deal .b{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.deal select{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:#fafbfc;width:100%;color:var(--muted)}
/* chat */
.chat{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 140px);min-height:520px;padding:0;overflow:hidden}
.clist{border-right:1px solid var(--line);overflow:auto}
.citem{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px}
.citem:hover{background:#fafbfc}.citem.on{background:var(--acc2)}
.av{width:36px;height:36px;border-radius:50%;background:#d7e0ec;display:grid;place-items:center;font-weight:700;font-size:13px;color:#33435c;flex-shrink:0}
.citem .m{flex:1;min-width:0}
.citem .p{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .un{background:var(--acc);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;height:18px;align-self:center;font-weight:600}
.cpane{display:flex;flex-direction:column;min-width:0}
.chead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.coex{margin-left:auto;font-size:12px;background:var(--acc2);color:var(--acc);padding:4px 10px;border-radius:20px;font-weight:600}
.coex.off{background:var(--gray2);color:var(--muted)}
.msgs{flex:1;overflow:auto;padding:18px;background:#f0ece4 linear-gradient(0deg,rgba(255,255,255,.35),rgba(255,255,255,.35))}
.msg{max-width:70%;margin-bottom:10px;display:flex;flex-direction:column}
.msg .bub{padding:8px 11px;border-radius:10px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-wrap;word-wrap:break-word}
.msg.me{margin-left:auto;align-items:flex-end}.msg.me .bub{background:#d9fdd3}
.msg .meta{font-size:11px;color:#6d7686;margin-top:3px}
.via{font-weight:600}.via.app{color:#8a5a00}.via.crm{color:var(--blue)}.via.auto{color:#7b3fc4}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px}
.sim{border-top:1px dashed var(--line);padding:8px 12px;display:flex;gap:8px;background:#fbfbfc;align-items:center;flex-wrap:wrap}
.sim span{font-size:12px;color:var(--muted);font-weight:600}
.quick{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer}
.quick button:hover{background:var(--gray2)}
/* automations */
.auto{display:flex;gap:16px;align-items:flex-start}
.auto .body{flex:1}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.node{font-size:12.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:#fafbfc}
.node.trg{background:var(--amber2);border-color:#f0dcae;color:#7a5307;font-weight:600}
.arrow{color:var(--muted)}
.sw{position:relative;width:40px;height:22px;flex-shrink:0}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:#cdd4de;border-radius:20px;cursor:pointer;transition:.2s}
.sw span:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--acc)}.sw input:checked+span:after{left:21px}
/* bars */
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.bar .lbl{width:130px;flex-shrink:0}
.bar .trk{flex:1;background:var(--gray2);border-radius:5px;height:10px;overflow:hidden}
.bar .fill{height:100%;background:var(--acc);border-radius:5px}
.bar .val{width:110px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task.done span{text-decoration:line-through;color:var(--muted)}
.log{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.log:last-child{border-bottom:0}
.log time{color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
/* integraciones */
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:9px 0 9px 36px;position:relative;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--gray2);display:grid;place-items:center;font-weight:700;font-size:12px}
.steps li.ok:before{content:"✓";background:var(--acc);color:#fff}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
code{background:var(--gray2);padding:1px 5px;border-radius:5px}
pre{background:#0f1a2c;color:#d6e2f5;padding:14px;border-radius:9px;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word}
.mt{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block;min-width:52px;text-align:center}
.mt.GET{background:var(--acc2);color:var(--acc)}.mt.POST{background:var(--blue2);color:var(--blue)}.mt.PATCH{background:var(--amber2);color:var(--amber)}
.note{background:var(--blue2);border:1px solid #cddcf8;color:#24457f;border-radius:9px;padding:11px 13px;font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(12,20,34,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.hidden{display:none!important}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:760px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:16px}
.mb{padding:4px 20px 18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 12px 12px}
.line{display:grid;grid-template-columns:1fr 70px 130px 30px;gap:8px;margin-bottom:8px}
.line input{border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
.doc{border:1px solid var(--line);border-radius:8px;padding:28px 30px;margin-top:14px;background:#fff}
.doc h2{text-align:center;margin:0 0 4px;font-size:18px;letter-spacing:.04em}
.doc .c{text-align:center;color:var(--muted);margin-bottom:20px}
.doc table td,.doc table th{padding:7px 8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#14213a;color:#fff;padding:10px 16px;border-radius:9px;font-weight:500;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .3s}
@media (max-width:900px){
  .app{flex-direction:column}
  aside{width:100%;height:auto;position:static}
  nav{flex-direction:row;overflow-x:auto}
  nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  nav a.on{border-bottom-color:var(--acc)}
  nav .sep,.side-foot{display:none}
  main{padding:18px 14px}
  .two,.row2{grid-template-columns:1fr}
  .chat{grid-template-columns:1fr;height:auto}
  .clist{max-height:220px;border-right:0;border-bottom:1px solid var(--line)}
  .msgs{min-height:340px}
}
</style>
</head>
<body>
<div class="app">
  <aside>

let S;
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed()}catch(e){S=seed()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function commit(){save();render()}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.add('hidden'),2600)}
function log(text){S.log.unshift({t:hhmm(new Date()),text});S.log=S.log.slice(0,40)}

/* ---------- getters ---------- */
const getC=id=>S.contacts.find(c=>c.id===id);
const cname=id=>{const c=getC(id);return c?c.name:'(sin contacto)'};
const first=id=>{const c=getC(id);return c?c.name.split(' ')[0]:''};
const invTotal=i=>i.items.reduce((s,l)=>s+(+l.qty||0)*(+l.price||0),0);
const unreadTotal=()=>Object.values(S.convos).reduce((s,c)=>s+(c.unread||0),0);

/* ---------- messaging + automation engine ---------- */
function pushMsg(cid,msg){
  if(!S.convos[cid])S.convos[cid]={unread:0,messages:[]};
  msg.id=uid('m');msg.time=hhmm(new Date());
  S.convos[cid].messages.push(msg);
  if(msg.from==='them'&&S.ui.active!==cid||msg.from==='them'&&location.hash.slice(1)!=='conversaciones')S.convos[cid].unread=(S.convos[cid].unread||0)+1;
}
function fill(t,ctx){const c=getC(ctx.contactId);return String(t||'')
  .replace(/\{nombre\}/g,c?c.name.split(' ')[0]:'').replace(/\{empresa\}/g,c?c.company:'')
  .replace(/\{factura\}/g,ctx.invoice?ctx.invoice.number:'').replace(/\{valor\}/g,ctx.invoice?fmt(invTotal(ctx.invoice)):'')}
function emit(trigger,ctx){
  let n=0;
  S.automations.filter(a=>a.active&&a.trigger===trigger).forEach(a=>{
    if(trigger==='message_in'&&a.cond&&!String(ctx.text||'').toLowerCase().includes(a.cond.toLowerCase()))return;
    if(trigger==='stage_changed'&&a.cond&&a.cond!==ctx.stage)return;
    a.runs=(a.runs||0)+1;n++;
    a.actions.forEach(act=>{
      if(act.type==='send_whatsapp')pushMsg(ctx.contactId,{from:'me',via:'auto',text:fill(act.value,ctx)});
      if(act.type==='add_tag'){const c=getC(ctx.contactId);if(c&&act.value&&!c.tags.includes(act.value))c.tags.push(act.value)}
      if(act.type==='move_stage'){S.deals.filter(d=>d.contactId===ctx.contactId&&d.stage!=='Perdido').forEach(d=>d.stage=act.value)}
      if(act.type==='create_task')S.tasks.unshift({id:uid('t'),text:fill(act.value,ctx),done:false,contactId:ctx.contactId});
    });
    log(`Automatización “${a.name}” ejecutada para ${cname(ctx.contactId)}`);
  });
  if(n)toast(`⚡ ${n} automatización${n>1?'es':''} ejecutada${n>1?'s':''}`);
  return n;
}
function createContact(data){
  const c={id:uid('c'),name:data.name,company:data.company||'',phone:data.phone||'',email:data.email||'',service:data.service||SERVICES[0],tags:data.tags||[],value:+data.value||0};
  S.contacts.unshift(c);
  S.deals.unshift({id:uid('d'),contactId:c.id,title:c.service,stage:'Prospecto',value:c.value});
  S.convos[c.id]=S.convos[c.id]||{unread:0,messages:[]};
  log(`Nuevo contacto: ${c.name}`);
  emit('contact_created',{contactId:c.id});
  return c;
}
function setStage(id,stage){
  const d=S.deals.find(x=>x.id===id);if(!d||d.stage===stage)return d;
  d.stage=stage;log(`“${d.title}” de ${cname(d.contactId)} pasó a ${stage}`);
  emit('stage_changed',{contactId:d.contactId,stage});return d;
}
function payInvoice(id){
  const i=S.invoices.find(x=>x.id===id);if(!i)return null;
  i.status='pagada';i.paidAt=today();log(`Cuenta de cobro ${i.number} marcada como pagada`);
  emit('invoice_paid',{contactId:i.contactId,invoice:i});return i;
}

    ['POST','/webhooks/whatsapp',{object:'whatsapp_business_account',entry:[{id:S.wa.waba,changes:[{field:'smb_message_echoes',value:{messaging_product:'whatsapp',metadata:{phone_number_id:S.wa.phoneId},message_echoes:[{from:S.wa.phoneId,to:'573005550102',type:'text',text:{body:'Te respondo desde el celular 📱'}}]}}]}]},'Webhook de coexistencia (eco desde la app)']
  ];

function apiCall(method,path,body){
  const r=(status,data)=>({status,data});
  const findByPhone=p=>S.contacts.find(c=>digits(c.phone)&&digits(c.phone).endsWith(digits(p).slice(-10)));
  let m;
  if(path==='/api/v1/contacts'){
    if(method==='GET')return r(200,{data:S.contacts,total:S.contacts.length});
    if(method==='POST'){if(!body||!body.name)return r(422,{error:'El campo "name" es obligatorio'});const c=createContact(body);return r(201,{data:c})}
  }
  if((m=path.match(/^\/api\/v1\/contacts\/([\w-]+)$/))){const c=getC(m[1]);if(!c)return r(404,{error:'Contacto no encontrado'});
    if(method==='GET')return r(200,{data:c});
    if(method==='PATCH'){['name','company','phone','email','service','tags','value'].forEach(k=>{if(body&&body[k]!==undefined)c[k]=body[k]});log(`API: contacto ${c.name} actualizado`);return r(200,{data:c})}}
  if(path==='/api/v1/deals'&&method==='GET')return r(200,{data:S.deals,total:S.deals.length});
  if((m=path.match(/^\/api\/v1\/deals\/([\w-]+)$/))&&method==='PATCH'){const d=S.deals.find(x=>x.id===m[1]);if(!d)return r(404,{error:'Oportunidad no encontrada'});
    if(body&&body.stage){if(!STAGES.includes(body.stage))return r(422,{error:'Etapa inválida',etapas:STAGES});setStage(d.id,body.stage)}
    if(body&&body.value!==undefined)d.value=+body.value;return r(200,{data:d})}
  if(path==='/api/v1/messages'&&method==='POST'){
    if(!S.wa.connected)return r(409,{error:'WhatsApp no está conectado'});
    const c=body&&(body.contactId?getC(body.contactId):findByPhone(body.to));
    if(!c)return r(404,{error:'Contacto no encontrado (usa contactId o to)'});if(!body.text)return r(422,{error:'"text" es obligatorio'});
    pushMsg(c.id,{from:'me',via:'crm',text:body.text});log(`API: WhatsApp enviado a ${c.name}`);
    return r(201,{messaging_product:'whatsapp',contacts:[{wa_id:digits(c.phone)}],messages:[{id:'wamid.'+uid('')}]})}
  if(path==='/api/v1/invoices'){
    if(method==='GET')return r(200,{data:S.invoices.map(i=>({...i,total:invTotal(i)}))});
    if(method==='POST'){if(!body||!getC(body.contactId))return r(422,{error:'contactId válido es obligatorio'});const i=newInvoice(body);return r(201,{data:i})}}
  if((m=path.match(/^\/api\/v1\/invoices\/([\w-]+)\/pay$/))&&method==='POST'){const i=S.invoices.find(x=>x.id===m[1]);if(!i)return r(404,{error:'Cuenta de cobro no encontrada'});
    if(i.status==='pagada')return r(409,{error:'Ya estaba pagada'});payInvoice(i.id);return r(200,{data:{...i,total:invTotal(i)}})}
  if(path==='/webhooks/whatsapp'&&method==='POST'){
    const ch=body&&body.entry&&body.entry[0]&&body.entry[0].changes&&body.entry[0].changes[0];if(!ch)return r(400,{error:'Payload inválido'});
    const v=ch.value||{};
    if(ch.field==='messages'&&v.messages){v.messages.forEach(msg=>{let c=findByPhone(msg.from);
      if(!c){const nm=(v.contacts&&v.contacts[0]&&v.contacts[0].profile&&v.contacts[0].profile.name)||('+'+msg.from);c=createContact({name:nm,phone:'+'+msg.from,tags:['whatsapp']})}
      const text=(msg.text&&msg.text.body)||'['+msg.type+']';pushMsg(c.id,{from:'them',text});log(`WhatsApp entrante de ${c.name}`);emit('message_in',{contactId:c.id,text})});return r(200,{ok:true})}
    if(ch.field==='smb_message_echoes'&&v.message_echoes){v.message_echoes.forEach(msg=>{const c=findByPhone(msg.to);if(c){pushMsg(c.id,{from:'me',via:'app',text:(msg.text&&msg.text.body)||''});log(`Eco de coexistencia: respuesta desde el celular a ${c.name}`)}});return r(200,{ok:true})}
    return r(200,{ok:true,ignored:ch.field})}
  if(path==='/webhooks/whatsapp'&&method==='GET')return r(200,'hub.challenge (verificación de Meta)');
  return r(404,{error:`Ruta no encontrada: ${method} ${path}`});
}

  const P=presets(),sel=S.ui.preset||0,p=P[sel]||P[0];
  return top('Probar API','Ejecuta peticiones contra el CRM. Los cambios se reflejan en los demás módulos y disparan automatizaciones.')+

    <label class="lb" style="margin-top:0">Ejemplo</label>
    <select class="f" onchange="App.preset(this.value)">${P.map((x,i)=>`<option value="${i}" ${i==sel?'selected':''}>${x[0]} ${x[1].replace('/api/v1','')} — ${x[3]}</option>`).join('')}</select>
    <div style="display:flex;gap:8px;margin-top:12px"><select class="f" id="am" style="width:110px">${['GET','POST','PATCH'].map(x=>`<option ${x===p[0]?'selected':''}>${x}</option>`).join('')}</select><input class="f" id="ap" value="${esc(p[1])}"></div>

   <div class="card"><h3>Respuesta</h3><pre id="ares">Pulsa “Ejecutar” para ver la respuesta.</pre>
    <div class="note" style="margin-top:14px">En producción estas rutas viven en tu servidor. <code>/webhooks/whatsapp</code> es la URL que registras en Meta: recibe los mensajes de clientes (<code>messages</code>) y, con coexistencia, también las respuestas que das desde el celular (<code>smb_message_echoes</code>).</div>

  _txt:id=>docText(S.invoices.find(x=>x.id===id)),
  sendInvoice(id){const i=S.invoices.find(x=>x.id===id);if(!S.wa.connected){toast('Conecta WhatsApp primero');return}
    pushMsg(i.contactId,{from:'me',via:'crm',text:`Hola ${first(i.contactId)}, te comparto la cuenta de cobro ${i.number} por ${fmt(invTotal(i))}, con fecha límite de pago ${dfmt(i.due)}.\n\n${S.issuer.pay}`});
    if(i.status==='borrador')i.status='enviada';log(`Cuenta de cobro ${i.number} enviada por WhatsApp a ${cname(i.contactId)}`);commit();toast(`${i.number} enviada por WhatsApp`)},
  pay(id){payInvoice(id);commit()},
  checkOverdue(){const t=today();let n=0;S.invoices.filter(i=>i.status==='enviada'&&i.due<t).forEach(i=>{i.status='vencida';n++;log(`Cuenta de cobro ${i.number} vencida`);emit('invoice_overdue',{contactId:i.contactId,invoice:i})});
    commit();if(!n)toast('No hay cuentas pendientes vencidas')},
  toggleAuto(id){const a=S.automations.find(x=>x.id===id);a.active=!a.active;log(`Automatización “${a.name}” ${a.active?'activada':'pausada'}`);commit()},
  delAuto(id){const a=S.automations.find(x=>x.id===id);confirmBox(`¿Eliminar la automatización <strong>${esc(a.name)}</strong>?`,'Eliminar',()=>{S.automations=S.automations.filter(x=>x.id!==id)})},
  editAuto(id){
    const a=id?S.automations.find(x=>x.id===id):{name:'',trigger:'message_in',cond:'',active:true,actions:[{type:'send_whatsapp',value:''}]};
    const acts=[0,1,2].map(k=>a.actions[k]||{type:'',value:''});
    modal(id?'Editar automatización':'Nueva automatización',`
      <label class="lb">Nombre</label><input class="f" id="au_n" value="${esc(a.name)}" placeholder="Ej.: Responder a quien pregunte por auditoría">
      <div class="row2"><div><label class="lb">Cuando…</label><select class="f" id="au_t">${Object.entries(TRIG).map(([k,v])=>`<option value="${k}" ${k===a.trigger?'selected':''}>${v}</option>`).join('')}</select></div>
      <div><label class="lb">Condición (opcional)</label><input class="f" id="au_c" list="stg" value="${esc(a.cond)}" placeholder="Palabra clave o etapa"><datalist id="stg">${STAGES.map(s=>`<option>${s}</option>`).join('')}</datalist></div></div>
      <p class="muted small" style="margin:6px 0 0">Para mensajes: el texto debe contener la palabra. Para cambio de etapa: nombre exacto de la etapa.</p>
      <label class="lb">Entonces…</label>
      ${acts.map((x,k)=>`<div style="display:grid;grid-template-columns:170px 1fr;gap:8px;margin-bottom:8px"><select class="f au_at"><option value="">— Sin acción —</option>${Object.entries(ACT).map(([kk,v])=>`<option value="${kk}" ${kk===x.type?'selected':''}>${v}</option>`).join('')}</select><input class="f au_av" value="${esc(x.value)}" placeholder="Mensaje, etiqueta, etapa o tarea"></div>`).join('')}
      <p class="muted small">Variables: {nombre} {empresa} {factura} {valor}</p>`,
      'Guardar',()=>{
        const name=$('#au_n').value.trim();if(!name){toast('Ponle un nombre');return false}
        const types=[...document.querySelectorAll('.au_at')].map(s=>s.value),vals=[...document.querySelectorAll('.au_av')].map(s=>s.value.trim());
        const actions=types.map((t,k)=>({type:t,value:vals[k]})).filter(x=>x.type);
        if(!actions.length){toast('Agrega al menos una acción');return false}
        const d={name,trigger:$('#au_t').value,cond:$('#au_c').value.trim(),actions};
        if(id)Object.assign(a,d);else S.automations.push({id:uid('a'),active:true,runs:0,...d});
        log(`Automatización “${name}” guardada`);commit();
      },true);
  },
  saveWa(){Object.assign(S.wa,{waba:$('#w_waba').value.trim(),phoneId:$('#w_phone').value.trim(),token:'',verify:$('#w_verify').value.trim(),coex:$('#w_coex').checked});log('Configuración de WhatsApp guardada');commit();toast('Guardado. (El token no se almacena en el prototipo)')},
  toggleWa(){S.wa.connected=!S.wa.connected;log(S.wa.connected?'WhatsApp conectado con Meta':'WhatsApp desconectado');commit()},
  rotateKey(){S.apiKey='crm_'+Math.random().toString(36).slice(2,14)+Math.random().toString(36).slice(2,10);log('API key regenerada');commit();toast('Nueva API key generada')},
  addHook(){modal('Nuevo webhook saliente',`<label class="lb">URL de destino</label><input class="f" id="hk_u" placeholder="https://…">
    <label class="lb">Eventos</label>${['contact.created','message.received','deal.stage_changed','invoice.paid','invoice.overdue'].map(e=>`<label class="task" style="border:0;padding:3px 0"><input type="checkbox" class="hk_e" value="${e}"><span><code>${e}</code></span></label>`).join('')}`,
    'Agregar',()=>{const u=$('#hk_u').value.trim(),ev=[...document.querySelectorAll('.hk_e:checked')].map(x=>x.value);if(!/^https?:\/\//.test(u)||!ev.length){toast('Escribe una URL válida y elige eventos');return false}S.hooks.push({id:uid('h'),url:u,events:ev});commit()})},
  delHook(id){S.hooks=S.hooks.filter(h=>h.id!==id);commit()},
  preset(i){S.ui.preset=+i;save();render()},
  run(){
    const m=$('#am').value,p=$('#ap').value.trim(),raw=$('#ab').value.trim();let body=null;
    if(raw&&m!=='GET'){try{body=JSON.parse(raw)}catch(e){$('#ares').textContent='Error: el body no es un JSON válido.\n'+e.message;return}}
    const res=apiCall(m,p,body);save();
    const out=`HTTP ${res.status}\n\n`+(typeof res.data==='string'?res.data:JSON.stringify(res.data,null,2));
    render();$('#ares').textContent=out;$('#ab').value=raw;$('#ap').value=p;$('#am').value=m;
  },
  curl(){const m=$('#am').value,p=$('#ap').value.trim(),b=$('#ab').value.trim();
    App.copy(`curl -X ${m} "https://api.tu-crm.com${p.replace('/api/v1','/api/v1')}" \\\n  -H "Authorization: Bearer ${S.apiKey}" \\\n  -H "Content-Type: application/json"`+(b&&m!=='GET'?` \\\n  -d '${b.replace(/\s*\n\s*/g,' ')}'`:''))},
  copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}}
};

load();
window.addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
})();
</script>
</body>
</html>
